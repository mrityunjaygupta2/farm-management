<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Animal Registration & QR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    input:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.5);
    }
    .fade-in {
      animation: fadeIn 0.6s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-green-50 min-h-screen p-6 flex flex-col items-center font-sans">

  <!-- Header -->
  <header class="bg-green-700 text-white w-full py-6 rounded shadow-md text-center">
    <h1 class="text-3xl font-bold">Animal Registration Portal</h1>
    <p class="text-sm mt-1">Register Animals · Generate QR · Export to Excel</p>
  </header>

  <!-- Main -->
  <main class="bg-white mt-8 p-8 w-full max-w-2xl rounded-xl shadow-lg fade-in">
    <form id="animalForm" class="space-y-5">
      <div>
        <label class="block text-gray-700 font-medium">Animal Name</label>
        <input id="animalName" class="w-full border p-2 rounded-md" placeholder="E.g., Bruno" required />
      </div>

      <div>
        <label class="block text-gray-700 font-medium">Animal Type</label>
        <input id="animalType" class="w-full border p-2 rounded-md" placeholder="E.g., Pig / Poultry" required />
      </div>

      <div>
        <label class="block text-gray-700 font-medium">Age (months)</label>
        <input id="animalAge" type="number" class="w-full border p-2 rounded-md" placeholder="E.g., 12" required />
      </div>

      <div>
        <label class="block text-gray-700 font-medium">Disease Status</label>
        <select id="diseaseStatus" class="w-full border p-2 rounded-md" required>
          <option value="">Select...</option>
          <option value="Healthy">Healthy</option>
          <option value="Sick">Sick</option>
          <option value="Recovering">Recovering</option>
        </select>
      </div>

      <div>
        <label class="block text-gray-700 font-medium">Vaccination Status</label>
        <select id="vaccinationStatus" class="w-full border p-2 rounded-md" required>
          <option value="">Select...</option>
          <option value="Vaccinated">Vaccinated</option>
          <option value="Not Vaccinated">Not Vaccinated</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded">
        Register & Generate QR
      </button>
    </form>

    <!-- QR Section -->
    <div id="qrSection" class="hidden mt-8 text-center fade-in">
      <h2 class="text-lg font-semibold text-green-700 mb-2">Scan QR to View Animal Info</h2>
      <div id="qrcode" class="inline-block border-4 border-green-500 p-2 rounded-lg bg-white shadow-md"></div>
    </div>

    <!-- Buttons -->
    <div class="mt-8 flex justify-between">
      <button id="downloadExcel" class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded shadow">
        Download Excel
      </button>
      <button id="clearData" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded shadow">
        Clear Data
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-10 text-sm text-gray-600 text-center">
    &copy; 2025 FarmGuard - All rights reserved
  </footer>

  <!-- Scripts -->
  <script>
    const form = document.getElementById("animalForm");
    const qrCodeDiv = document.getElementById("qrcode");
    const qrSection = document.getElementById("qrSection");
    const downloadBtn = document.getElementById("downloadExcel");
    const clearBtn = document.getElementById("clearData");

    let animalDataList = [];

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const data = {
        ID: 'A-' + Date.now(),
        Name: document.getElementById("animalName").value.trim(),
        Type: document.getElementById("animalType").value.trim(),
        Age: document.getElementById("animalAge").value.trim(),
        Disease: document.getElementById("diseaseStatus").value,
        Vaccinated: document.getElementById("vaccinationStatus").value,
        RegisteredAt: new Date().toLocaleString()
      };

      // Save for Excel
      animalDataList.push(data);

      // Generate QR content
      const qrData = `
Animal ID: ${data.ID}
Name: ${data.Name}
Type: ${data.Type}
Age: ${data.Age} months
Disease: ${data.Disease}
Vaccination: ${data.Vaccinated}
Registered At: ${data.RegisteredAt}
      `;

      // Show QR code
      qrCodeDiv.innerHTML = "";
      new QRCode(qrCodeDiv, {
        text: qrData.trim(),
        width: 230,
        height: 230,
        colorDark: "#14532d",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      qrSection.classList.remove("hidden");
      form.reset();
    });

    downloadBtn.addEventListener("click", () => {
      if (animalDataList.length === 0) {
        alert("No data to export.");
        return;
      }

      const worksheet = XLSX.utils.json_to_sheet(animalDataList);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Animals");

      XLSX.writeFile(workbook, "Animal_Records.xlsx");
    });

    clearBtn.addEventListener("click", () => {
      if (confirm("Are you sure you want to clear all animal data?")) {
        animalDataList = [];
        alert("Data cleared.");
      }
    });
  </script>
</body>
</html>
