<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Digital Farm Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      height: 100vh;
      background: #f0f4fa;
    }

    .login-container {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: linear-gradient(180deg, #d5e4fc, #bde1fa);
      border-radius: 20px;
      width: 320px;
      padding: 40px 30px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .leaf-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 15px;
      fill: #3cb371;
    }

    .login-box h1 {
      font-size: 20px;
      margin-bottom: 4px;
      font-weight: 700;
      color: #222;
    }

    .login-box p.subtitle {
      font-weight: 300;
      font-size: 14px;
      margin-bottom: 28px;
      color: #555;
    }

    .login-box input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 8px;
      border: none;
      margin-bottom: 20px;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 0 5px #aaa;
      transition: box-shadow 0.3s ease;
    }

    .login-box input:focus {
      box-shadow: inset 0 0 8px #3cb371;
    }

    .login-box button {
      width: 100%;
      padding: 14px 0;
      background-color: #3cb371;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .login-box button:hover {
      background-color: #31965c;
    }

    .login-box p.terms {
      margin-top: 20px;
      font-size: 12px;
      color: #555;
    }

    .login-box p.terms a {
      color: #2081e2;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-container" id="loginPage">
    <div class="login-box">
      <svg class="leaf-icon" viewBox="0 0 24 24">
        <path d="M12 2C12 2 18 7.25 18 13.675C18 18.232 14.427 22 12 22C9.573 22 6 18.232 6 13.675C6 9 12 2 12 2Z" />
      </svg>
      <h1>Welcome Digital Farm Management</h1>
      <p class="subtitle">Your AI-Powered Farm Advisory</p>

      <form id="loginForm">
        <input type="text" id="username" placeholder="Enter Your Username" required />
        <input type="password" id="password" placeholder="Enter Your Password" required />
        <button type="submit" id="Dashboard">Login to Your Dashboard</button>
      </form>

      <p class="terms">By logging in, you agree to our <a href="#">Terms of Service</a>.</p>
    </div>
  </div>

  <script>
    // let Dashboard = document.getElementById("Dashboard").addEventListener("click", function(){
    //   window.location.href = 'Dashboard45.html';
    // })

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (user === "admin" && pass === "1234") {
        // alert("Login successful! Redirecting to dashboard...");
        // Redirect to dashboard or load dashboard page
        window.location.href = 'Dashboard45.html';  // Example redirection
      } else {
        alert("Invalid login! Use Username: admin | Password: 1234");
      }
    });
  </script>

</body>

</html>
